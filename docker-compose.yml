services:
  api:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    image: brand-post-recipe-py
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      HOME: /tmp
    volumes:
      - .:/app
      # Host time zone, so times in the CLI and logs match the user's clock
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8001:8000"

  # docker compose run --rm cli new inputs/zmajska/brief.yaml
  cli:
    image: brand-post-recipe-py
    profiles: ["cli"]
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      HOME: /tmp
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    entrypoint: ["python", "cli.py"]

  # docker compose run --rm pytest
  pytest:
    image: brand-post-recipe-py
    profiles: ["test"]
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
    volumes:
      - .:/app
    entrypoint: ["pytest", "-p", "no:cacheprovider"]

  frontend:
    image: node:26-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      API_URL: http://api:8000
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5175:5175"
    depends_on:
      - api
