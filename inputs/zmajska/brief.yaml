audience: >
  Odrasli 25-45, urbani, uglavnom Zagreb i veći gradovi u Hrvatskoj. Ljubitelji craft piva,
  ali i oni koji craft tek otkrivaju i žele nešto bolje od industrijskog lagera.
  Druže se u pubovima i na koncertima, cijene humor i lokalne priče.

goals:
  - Podsjetiti na stalnu ponudu (Pale Ale, Pozoj IPA, Berry Sour, Pils) i potaknuti kupnju u webshopu ili trgovini
  - Više komentara i spremanja objava (engagement)
  - Edukacija - približiti stilove craft piva ljudima koji ih ne poznaju

inspiration: >
  Vlastiti event posteri brenda (jarke ravne boje, zmaj, krupna zbijena slova), fotografije
  iz SIP puba i taproom-a, duhoviti opisi s igrama riječi.

constraints:
  - Odgovorna komunikacija alkohola - bez obraćanja maloljetnicima, bez poticanja prekomjernog pijenja, bez zdravstvenih tvrdnji
  - Ne izmišljati cijene, popuste, nagrade ni događaje
  - Etiketa, limenka/boca i logo moraju ostati točni

