[project]
name = "brand-post-recipe"
version = "0.1.0"
description = "AI recipe: from an Instagram brand to three finished posts (Claude + Gemini)"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.0",
    "google-genai>=1.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "pillow>=11.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
